# Хуки Spec Kit. Описание механизма: docs/harness/reference.md
hooks:
  after_implement:
    - extension: platform
      command: docs.sync
      description: Сверить изменившиеся факты с файлами-владельцами и запустить проверку документации
      prompt: Выполнить синхронизацию документации перед завершением
      optional: false
      enabled: true
  after_constitution:
    - extension: platform
      command: docs.sync
      description: Проверить, что поправка конституции согласована с остальными файлами
      prompt: Выполнить синхронизацию документации после поправки конституции
      optional: false
      enabled: true
    - extension: platform
      command: audit
      description: Смысловой аудит согласованности харнеса после поправки конституции
      prompt: Запустить смысловой аудит харнеса
      optional: true
      enabled: true
